name: Runtime bundle contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache: true
      - name: Test runtime bundle fail-closed contract
        run: |
          go test -race -count=1 ./bundle ./cmd/runtime-bundle
          scripts/test-bundle-contract.sh
          scripts/test-package-native-bundle.sh
